set-option -a terminal-features 'xterm-256color:RGB:clipboard'
# set -g default-command $SHELL
set -g escape-time 10
set -g mouse on

# Does not work with new-session ... /dev/null
# set -g remain-on-exit on

set -g renumber-windows on
set -g status-left-length 20
set -g status-right ""
set -g set-clipboard external

unbind -n Tab

CWD="$HOME/programming/c/fibonacci"
new-session -c "$CWD" -ds fibonacci
new-window -c "$CWD" -n bash -t fibonacci
new-window -c "$CWD" -dn bash -t fibonacci
new-window -c "$CWD" -dn bash -t fibonacci
new-window -c "$CWD" -dn neovim -t fibonacci nvim Makefile src/matrix_multiply.c src/matrix_multiply.h

new-session -ds general
new-window -dn bash -t general bash
new-window -dn bash -t general bash
new-window -dn bash -t general bash
new-window -dn neovim -t general nvim

CWD="$HOME/programming/c/pkg"
new-session -c "$CWD" -ds pkg
new-window -c "$CWD" -dn bash -t pkg
new-window -c "$CWD" -dn bash -t pkg
new-window -c "$CWD" -dn bash -t pkg
new-window -c "$CWD" -dn neovim -t pkg nvim Makefile main.c pkg.c pkg.h notes.txt

CWD="$HOME/programming/reddit-dl"
new-session -c "$CWD" -ds reddit-dl
new-window -c "$CWD" -dn bash -t reddit-dl
new-window -c "$CWD" -dn bash -t reddit-dl
new-window -c "$CWD" -dn bash -t reddit-dl
new-window -c "$CWD" -dn neovim -t reddit-dl nvim manifest.json reddit-dl.js downloader.js
